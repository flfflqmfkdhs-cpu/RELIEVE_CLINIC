<!DOCTYPE html>
<!-- og.png 생성용 소스. 브라우저 1200x630 으로 캡처하면 됩니다. 배포물에는 포함되지 않습니다. -->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    /* 사이트 배경과 동일한 웜톤 그라데이션 */
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(110% 70% at 50% -6%, rgba(168, 135, 74, .13), transparent 60%),
        radial-gradient(80% 45% at 50% 104%, rgba(168, 135, 74, .06), transparent 70%),
        #faf8f5;
      font-family: Pretendard, -apple-system, system-ui, sans-serif;
    }

    /* 안쪽 골드 테두리 */
    .card::after {
      content: "";
      position: absolute;
      inset: 34px;
      border: 1px solid rgba(168, 135, 74, .3);
      pointer-events: none;
    }

    /* 로고 원본이 검정이라 마스크로 브랜드 초록을 입힘 (index.html 과 동일한 방식) */
    .logo {
      height: 230px;
      aspect-ratio: 446 / 352;
      background-color: #678b73;
      -webkit-mask: url("../images/relieve_clinic_profile.png") no-repeat center / contain;
      mask: url("../images/relieve_clinic_profile.png") no-repeat center / contain;
    }

    .rule {
      width: 64px;
      height: 1px;
      margin: 42px 0 26px;
      background: linear-gradient(90deg, transparent, #a8874a, transparent);
    }

    .tagline {
      margin: 0;
      font-size: 22px;
      font-weight: 400;
      color: #8a8579;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo" role="img" aria-label="RELIEVE CLINIC"></div>
    <div class="rule"></div>
    <p class="tagline">Your Exclusive Relieve Experience</p>
  </div>
</body>

</html>
