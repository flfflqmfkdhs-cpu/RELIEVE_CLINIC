<!DOCTYPE html>
<!-- favicon.png / apple-touch-icon.png 생성용 소스. 배포물에는 포함되지 않습니다.
     로고 이미지에서 상단 R 마크 부분만 잘라내 사용합니다.

       favicon.png          → tools/favicon.html            를 256x256 으로 캡처
       apple-touch-icon.png → tools/favicon.html?size=180&square 를 180x180 으로 캡처

     ?square 는 모서리를 각지게 만듭니다. iOS 홈 화면 아이콘은 시스템이 알아서 둥글게
     깎기 때문에, 투명한 둥근 모서리를 넣으면 그 부분이 검게 보입니다. -->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; }

    html, body { margin: 0; overflow: hidden; }

    /* 사이트와 동일한 아이보리 바탕 + 원본 검정 마크 */
    .icon {
      background: #faf8f5;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .crop {
      position: relative;
      overflow: hidden;
    }

    /* 원본 446x352 중 R 마크는 대략 x 152~298, y 5~145 구간이고 가로로는 이미지 중앙에 있음.
       그 구간이 .crop 을 꽉 채우도록 확대 후 위치를 잡음. (비율은 .icon 크기에 비례) */
    .crop .mark {
      position: absolute;
      background-color: #678b73;
      -webkit-mask: url("../images/relieve_clinic_profile.png") no-repeat center / 100% 100%;
      mask: url("../images/relieve_clinic_profile.png") no-repeat center / 100% 100%;
    }
  </style>
</head>

<body>
  <div class="icon">
    <div class="crop">
      <i class="mark" role="img" aria-label="R"></i>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const size = Number(params.get("size")) || 256;
    const square = params.has("square");

    // 256px 기준으로 잡아둔 값들을 요청 크기에 맞춰 등비로 확대·축소
    const k = size / 256;

    const icon = document.querySelector(".icon");
    icon.style.width = icon.style.height = `${size}px`;
    icon.style.borderRadius = square ? "0" : `${52 * k}px`;

    const crop = document.querySelector(".crop");
    crop.style.width = crop.style.height = `${178 * k}px`;

    const img = document.querySelector(".crop .mark");
    img.style.width = `${467 * k}px`;
    img.style.height = `${467 * k * 352 / 446}px`;
    img.style.left = `${-147 * k}px`;
    img.style.top = `${10 * k}px`;
  </script>
</body>

</html>
