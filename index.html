<!-- 문서 종류를 HTML5로 선언 -->
<!DOCTYPE html>
<!-- html 태그 시작, 언어는 영어(기본값) -->
<html lang="en">

<!-- head 시작 -->

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>RELIEVE CLINIC | 🌿Your Exclusive Relieve Experience🌿</title>
  <meta name="description" content="🌿 Your Exclusive Relieve Experience 🌿" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="RELIEVE CLINIC" />
  <meta property="og:description" content="🌿 Your Exclusive Relieve Experience 🌿" />
  <!-- 아래 두 줄의 자리표시자는 build.mjs 가 배포 시점에 실제 주소로 자동 치환합니다. 직접 고치지 마세요. -->
  <meta property="og:image" content="__SITE_URL__/og.png" />
  <meta property="og:url" content="__SITE_URL__" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="favicon.png" />
  <!-- iOS "홈 화면에 추가" 시 쓰이는 아이콘 -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <!-- 모바일 브라우저 상단 주소창 색을 페이지 배경과 맞춤 -->
  <meta name="theme-color" content="#f7e8e8" />
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    :root {
      --bg: #f7e8e8;
      --card: #ffffff;
      --title: #1c2340;
      --sub: #737780;
      --section: #1c2340;
      --shadow: 0 1px 3px rgba(0, 0, 0, .08), 0 4px 12px rgba(0, 0, 0, .05);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
    }

    body {
      /* 마지막 섹션(Others)이 화면 하단에 딱 붙어 보이지 않도록 여유 공간 확보.
         주의: 여기에 height:100% 를 주면 이 padding 이 그 높이 "안쪽"으로 들어가고
         내용은 밖으로 넘쳐버려서, 값을 아무리 키워도 실제 여백이 생기지 않습니다.
         내용 길이와 무관하게 항상 동작하도록 min-height 를 씁니다. */
      min-height: 100dvh;
      padding: 0 20px 140px;
      background: var(--bg);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", sans-serif;
      color: var(--title);
      -webkit-font-smoothing: antialiased;
    }

    .bg-fixed {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: url("images/bg.png") no-repeat center;
      filter: brightness(1.09) contrast(1.05) saturate(0.85);
      background-size: cover;
    }

    .wrap {
      max-width: 600px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .hero-spacer {
      height: 10dvh;
      min-height: 5px;
    }

    /* ── 프로필 영역: 흰 카드 없이, 로고·문구·아이콘이 배경 사진 위에 바로 놓임 ── */
    .profile {
      position: relative;
      margin: 0 auto 34px;
      padding: 0 28px;
      max-width: 400px;
      text-align: center;
    }

    /* 로고: 카드가 없어졌으니 배경 위에 바로 큼직하게 표시 */
    .logo {
      width: auto;
      height: 170px;
      margin: 0 auto 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      /* 밝은 배경 사진 위에서도 로고가 또렷이 보이도록 그림자 추가 */
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .18));
    }

    .logo img {
      width: auto;
      height: 100%;
      object-fit: contain;
    }

    .logo span {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -.02em;
      color: var(--title);
    }

    /* 소개 문구: 배경 사진 위에서도 잘 읽히도록 색과 그림자 조정 */
    .tagline {
      margin: 0;
      font-size: 13px;
      font-weight: 500;
      color: #2b2420;
      letter-spacing: .02em;
      line-height: 1.6;
      text-shadow: 0 1px 4px rgba(255, 255, 255, .6);
    }

    /* SNS 아이콘 + 언어 전환 버튼 영역: 카드가 없으니 구분선 대신 여백으로만 분리 */
    .social {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .social a {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #1c2340;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform .15s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .15);
    }

    .social a:hover {
      transform: translateY(-2px);
    }

    /* 카카오톡: 브랜드 노란색 배경 + 검정 아이콘 */
    .social a.kakao {
      background: #FEE500;
      color: #191919;
    }

    /* 왓츠앱: 브랜드 초록색 배경 */
    .social a.whatsapp {
      background: #25D366;
      color: #fff;
    }

    /* 네이버: 브랜드 초록색 배경 */
    .social a.naver {
      background: #03C75A;
      color: #fff;
    }

    /* ── 언어 전환 버튼 ── */
    .lang-toggle {
      height: 34px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid #1c2340;
      background: #fff;
      color: #1c2340;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .02em;
      cursor: pointer;
      transition: background .15s ease, color .15s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .1);
    }

    .lang-toggle:hover {
      background: #1c2340;
      color: #fff;
    }

    .section-title {
      margin: 58px 0 14px;
      font-size: 22px;
      font-weight: 700;
      color: var(--section);
      text-align: center;
      letter-spacing: -.02em;
    }

    .section-title:first-of-type {
      margin-top: 0;
    }

    /* ── 링크 블록: 기본은 반투명 베이지, 마우스 올리면(hover)/눌렀을 때(active) 흰색으로 ── */
    .block {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      padding: 8px;
      min-height: 64px;
      background: rgba(245, 243, 239, 0.75);
      border-radius: 14px;
      box-shadow: var(--shadow);
      text-decoration: none;
      color: inherit;
      transition: transform .16s ease, box-shadow .16s ease, background .2s ease;
    }

    .block:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, .1), 0 10px 24px rgba(0, 0, 0, .08);
      background: var(--card);
    }

    .block:active {
      transform: scale(.985);
      background: var(--card);
    }

    .block:focus-visible {
      outline: 2px solid var(--title);
      outline-offset: 3px;
    }

    .thumb {
      flex: 0 0 48px;
      width: 48px;
      height: 48px;
      border-radius: 8px;
      overflow: hidden;
      background: #d8dae0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .label {
      flex: 1;
      padding: 0 12px;
      font-size: 19px;
      font-weight: 600;
      text-align: center;
      letter-spacing: -.02em;
      word-break: keep-all;
    }

    .share {
      flex: 0 0 32px;
      width: 32px;
      height: 32px;
      margin-right: 4px;
      border: 0;
      padding: 0;
      background: transparent;
      border-radius: 50%;
      color: #9a9da5;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s ease;
    }

    .share:hover {
      background: #f0f0f2;
      color: #4b4f58;
    }

    .share:focus-visible {
      outline: 2px solid var(--title);
      outline-offset: 2px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 32px;
      transform: translate(-50%, 16px);
      padding: 11px 20px;
      background: #1c2340;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      z-index: 10;
    }

    .toast.on {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <div class="bg-fixed"></div>

  <main class="wrap">
    <div class="hero-spacer"></div>

    <div class="profile">
      <div class="logo" id="logo"></div>
      <p class="tagline" id="tagline"></p>
      <div class="social">
        <!-- 인스타그램 -->
        <a href="https://www.instagram.com/relieve_clinic_/" target="_blank" rel="noopener" aria-label="Instagram">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="2" width="20" height="20" rx="5" />
            <circle cx="12" cy="12" r="4.2" />
            <circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none" />
          </svg>
        </a>
        <!-- 카카오톡 채널 바로가기 -->
        <a class="kakao" href="https://pf.kakao.com/_EUxjMn" target="_blank" rel="noopener" aria-label="KakaoTalk">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M12 3C6.48 3 2 6.58 2 11c0 2.86 1.9 5.37 4.75 6.8-.2.75-.73 2.72-.84 3.15-.13.53.2.53.42.38.17-.12 2.68-1.82 3.77-2.56.62.09 1.26.13 1.9.13 5.52 0 10-3.58 10-8s-4.48-8-10-8z" />
          </svg>
        </a>
        <!-- 왓츠앱 바로가기 -->
        <a class="whatsapp" href="https://api.whatsapp.com/message/RT4JNG7U3XNIP1?autoload=1&amp;app_absent=0"
          target="_blank" rel="noopener" aria-label="WhatsApp">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.87 9.87 0 0 0 4.74 1.21h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.46 17.5 2 12.04 2zm5.8 14.02c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.13.11-1.82-.11-.42-.13-.96-.31-1.65-.6-2.9-1.25-4.79-4.17-4.94-4.36-.14-.2-1.18-1.57-1.18-3 0-1.42.75-2.12 1.02-2.41.26-.28.58-.36.77-.36.19 0 .39 0 .55.01.18.01.42-.07.65.5.24.58.82 2 .89 2.15.07.14.12.31.02.5-.1.19-.15.31-.3.48-.14.17-.31.37-.44.5-.15.14-.3.3-.13.6.17.29.75 1.24 1.62 2.01 1.11 1 2.05 1.31 2.34 1.46.29.15.46.13.63-.07.17-.2.72-.84.91-1.13.19-.29.38-.24.63-.14.26.1 1.65.78 1.93.92.29.14.48.21.55.33.07.12.07.68-.17 1.36z" />
          </svg>
        </a>
        <!-- 네이버 예약 바로가기 -->
        <a class="naver" href="https://booking.naver.com/booking/13/bizes/1302224" target="_blank" rel="noopener"
          aria-label="Naver">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M16.3 2v10.5L7.8 2H2v20h6V9.5l8.5 12.5H24V2z" />
          </svg>
        </a>
        <button class="lang-toggle" id="langToggle" type="button">KOR</button>
      </div>
    </div>

    <div id="sections"></div>
  </main>

  <div class="toast" id="toast">Link copied</div>

  <script>
    const SITE_KO = {
      logo: "images/relieve_clinic_profile.png",
      logoText: "R",
      name: "RELIEVE CLINIC",
      tagline: "🌿 Your Exclusive Relieve Experience 🌿",
      toastCopied: "링크를 복사했습니다",
      toastFailed: "복사할 수 없습니다. 주소창에서 직접 복사해 주세요",

      sections: [
        {
          title: "ABOUT 릴리브 클리닉",
          blocks: [
            { label: "릴리브 클리닉", url: "https://app.notion.com/p/3a5a23965f2080ee949bd55eef1eb751", thumb: "images/icon1_leaf_circle.png" },
            { label: "사후관리", url: "https://app.notion.com/p/3a5a23965f2080ee949bd55eef1eb751", thumb: "images/icon2_door_circle.png" },
            { label: "이달의 프로모션", url: "https://app.notion.com/p/3a5a23965f2080ee949bd55eef1eb751", thumb: "images/icon3_road_circle.png" }
          ]
        },
        {
          title: "이달의 릴리브픽",
          blocks: [
            { label: "이달의 릴리브픽", url: "https://app.notion.com/p/3a5a23965f2080ee949bd55eef1eb751", thumb: "images/icon4_monogram_circle.png" }
          ]
        },
        {
          /* [수정] 컨시어지 섹션: 3블록 → 5블록으로 확장, 각 실제 노션 링크 연결
             (필요시 thumb 이미지 경로만 원하는 아이콘 파일명으로 교체하면 됨) */
          title: "컨시어지",
          blocks: [
            { label: "맛집", url: "https://app.notion.com/p/Recommended-Restaurants-3ada23965f2080ba957bcec6b13289a8", thumb: "images/icon1_leaf_circle.png" },
            { label: "여행", url: "https://app.notion.com/p/Travel-Concierge-3ada23965f20803887bdc7e943e83de4", thumb: "images/icon3_road_circle.png" },
            { label: "쇼핑", url: "https://app.notion.com/p/Shopping-Concierge-3b2a23965f2080cd9d03d9679f8bf164?source=copy_link", thumb: "images/icon2_door_circle.png" },
            { label: "웰니스", url: "https://app.notion.com/p/Stay-Care-Concierge-3b2a23965f2080f980ffe1a350986b67", thumb: "images/icon4_monogram_circle.png" },
            { label: "여행 필수품", url: "https://app.notion.com/p/Travel-Essentials-3b2a23965f2080759b1ccff65b2f764c", thumb: "images/icon1_leaf_circle.png" }
          ]
        },
        /* [삭제] "추천코스" 섹션(Relieve Pick 블록) 제거 요청으로 통째로 삭제됨 */
        {
          title: "기타",
          blocks: [
            { label: "건의사항 및 만족도", url: "https://app.notion.com/p/3a5a23965f2080ee949bd55eef1eb751", thumb: "images/icon2_door_circle.png" }
          ]
        }
      ]
    };

    const SITE_EN = {
      logo: "images/relieve_clinic_profile.png",
      logoText: "R",
      name: "RELIEVE CLINIC",
      tagline: "💫 Your Exclusive Relieve Experience 💫",
      toastCopied: "Link copied",
      toastFailed: "Couldn't copy. Please copy the link from the address bar",

      sections: [
        {
          title: "ABOUT RELIEVE CLINIC",
          blocks: [
            { label: "Relieve Clinic", url: "https://app.notion.com/p/3a5a23965f2080ee949bd55eef1eb751", thumb: "images/icon1_leaf_circle.png" },
            { label: "Aftercare", url: "https://app.notion.com/p/3a5a23965f2080ee949bd55eef1eb751", thumb: "images/icon2_door_circle.png" },
            { label: "This Month's Promotion", url: "https://app.notion.com/p/3a5a23965f2080ee949bd55eef1eb751", thumb: "images/icon3_road_circle.png" }
          ]
        },
        {
          title: "This Month's Pick",
          blocks: [
            { label: "This Month's Pick", url: "https://app.notion.com/p/Monthly-Picks-3b2a23965f20807887e2ff8580851271", thumb: "images/icon4_monogram_circle.png" }
          ]
        },
        {
          /* [수정] Concierge 섹션: 3블록 → 5블록으로 확장, 각 실제 노션 링크 연결
             (필요시 thumb 이미지 경로만 원하는 아이콘 파일명으로 교체하면 됨) */
          title: "Concierge",
          blocks: [
            { label: "Food", url: "https://app.notion.com/p/Recommended-Restaurants-3ada23965f2080ba957bcec6b13289a8", thumb: "images/icon1_leaf_circle.png" },
            { label: "Travel", url: "https://app.notion.com/p/Travel-Concierge-3ada23965f20803887bdc7e943e83de4", thumb: "images/icon3_road_circle.png" },
            { label: "Shopping", url: "https://app.notion.com/p/Shopping-Concierge-3b2a23965f2080cd9d03d9679f8bf164?source=copy_link", thumb: "images/icon2_door_circle.png" },
            { label: "Stay&Care", url: "https://app.notion.com/p/Stay-Care-Concierge-3b2a23965f2080f980ffe1a350986b67", thumb: "images/icon4_monogram_circle.png" },
            { label: "Travel essentials", url: "https://app.notion.com/p/Travel-Essentials-3b2a23965f2080759b1ccff65b2f764c", thumb: "images/icon1_leaf_circle.png" }
          ]
        },
        /* [삭제] "Recommended Course" 섹션(Relieve Pick 블록) 제거 요청으로 통째로 삭제됨 */
        {
          title: "Others",
          blocks: [
            { label: "Feedback & Satisfaction", url: "https://app.notion.com/p/3a5a23965f2080ee949bd55eef1eb751", thumb: "images/icon2_door_circle.png" }
          ]
        }
      ]
    };

    let currentLang = "en";

    function getSite() {
      return currentLang === "ko" ? SITE_KO : SITE_EN;
    }

    function renderProfile() {
      const site = getSite();
      const logo = document.getElementById("logo");
      logo.innerHTML = site.logo
        ? `<img src="${site.logo}" alt="${site.name} logo" />`
        : `<span>${site.logoText}</span>`;
      document.getElementById("tagline").textContent = site.tagline;
    }

    function renderBlock(block) {
      const thumb = block.thumb
        ? `<img src="${block.thumb}" alt="" />`
        : `<span></span>`;

      return `
    <a class="block" href="${block.url}" target="_blank" rel="noopener">
      <span class="thumb">${thumb}</span>
      <span class="label">${block.label}</span>
      <button class="share" type="button" data-url="${block.url}" aria-label="${block.label}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <circle cx="12" cy="5" r="1.8" /><circle cx="12" cy="12" r="1.8" /><circle cx="12" cy="19" r="1.8" />
        </svg>
      </button>
    </a>`;
    }

    function renderSections() {
      const site = getSite();
      document.getElementById("sections").innerHTML = site.sections.map(section => `
    <h2 class="section-title">${section.title}</h2>
    ${section.blocks.map(renderBlock).join("")}
  `).join("");
    }

    let toastTimer;
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("on");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("on"), 1800);
    }

    function toggleLang() {
      currentLang = currentLang === "ko" ? "en" : "ko";
      document.getElementById("langToggle").textContent = currentLang === "ko" ? "EN" : "KOR";
      document.documentElement.lang = currentLang;
      renderProfile();
      renderSections();
    }

    document.getElementById("langToggle").addEventListener("click", toggleLang);

    document.addEventListener("click", async event => {
      const button = event.target.closest(".share");
      if (!button) return;

      event.preventDefault();
      const url = button.dataset.url;
      const site = getSite();

      if (navigator.share) {
        try { await navigator.share({ url }); return; } catch { /* cancelled → fall through to copy */ }
      }
      try {
        await navigator.clipboard.writeText(url);
        showToast(site.toastCopied);
      } catch {
        showToast(site.toastFailed);
      }
    });

    renderProfile();
    renderSections();
  </script>
</body>

</html>
