  <style>
    :root {
      --bg: #faf8f5;
      /* 브랜드 초록 (로고 원본에서 추출한 값) */
      --brand: #678b73;
      --card: #ffffff;
      --card-line: rgba(31, 34, 41, .07);
      /* 포인트 컬러: 밝은 배경에서도 읽히도록 채도를 낮춘 앤티크 골드 */
      --gold: #a8874a;
      --gold-line: rgba(168, 135, 74, .26);
      --text: #1f2229;
      --text-dim: #8a8579;
      --shadow: 0 1px 2px rgba(31, 34, 41, .04), 0 6px 16px rgba(31, 34, 41, .05);
      --shadow-hover: 0 2px 6px rgba(31, 34, 41, .06), 0 14px 32px rgba(31, 34, 41, .10);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
    }

    body {
      /* 마지막 섹션이 화면 하단에 딱 붙어 보이지 않도록 여유 공간 확보.
         주의: 여기에 height:100% 를 주면 이 padding 이 그 높이 "안쪽"으로 들어가고
         내용은 밖으로 넘쳐버려서, 값을 아무리 키워도 실제 여백이 생기지 않습니다.
         내용 길이와 무관하게 항상 동작하도록 min-height 를 씁니다. */
      min-height: 100dvh;
      padding: 0 20px 140px;
      background: var(--bg);
      /* 라틴은 Noto Serif, 한글은 Noto Serif KR 이 받습니다 */
      font-family: "Noto Serif", "Noto Serif KR", "Apple SD Gothic Neo", serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* 배경: 수채화 그라데이션 사진 한 장.
       이미지를 빼고 CSS 그라데이션으로 돌아가려면 background 를 아래로 교체하면 됩니다.
         background:
           radial-gradient(85% 48% at 10% 2%, rgba(255,233,203,.85), transparent 62%),
           radial-gradient(80% 45% at 88% 84%, rgba(219,233,219,.6), transparent 62%),
           linear-gradient(168deg, #fffdf9, #f4f0e7);
       사진이 너무 진하면 아래 filter 주석을 풀어 밝기를 올리면 됩니다. */
    .bg-fixed {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: url("images/bg.png") no-repeat center / cover, var(--bg);
      /* filter: brightness(1.05) saturate(.92); */
    }

    .wrap {
      max-width: 600px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .hero-spacer {
      height: 9dvh;
      min-height: 34px;
    }

    /* ── 안내 문구 + 언어 전환 버튼을 한 줄에 나란히 ── */
    .tagline-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .lang-toggle {
      height: 34px;
      padding: 0 15px;
      border-radius: 999px;
      border: 1px solid var(--gold-line);
      background: rgba(255, 255, 255, .82);
      color: var(--gold);
      font-size: 11px;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: .14em;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: background .18s ease, color .18s ease, border-color .18s ease;
    }

    .lang-toggle:hover {
      background: var(--gold);
      border-color: var(--gold);
      color: #fff;
    }

    .lang-toggle:focus-visible {
      outline: 1px solid var(--gold);
      outline-offset: 3px;
    }

    /* ── 프로필 영역 ── */
    .profile {
      margin: 0 auto 46px;
      /* 안내 문구 + KOR 버튼이 좁은 화면에서도 한 줄에 들어가도록 좌우 여백 없음
         (바깥 body 의 padding 이 이미 20px 확보하고 있음) */
      max-width: 460px;
      text-align: center;
    }

    .logo {
      height: 136px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 로고 원본 파일은 검정입니다. 이미지를 그대로 쓰지 않고 "마스크"로 써서
       브랜드 초록으로 칠합니다. 색을 바꾸려면 --brand 값만 고치면 됩니다.
       (로고 파일 자체가 이미 원하는 색이면 background-color 를 지우고
        .mark 를 <img> 로 되돌려도 됩니다.) */
    .logo .mark {
      height: 100%;
      aspect-ratio: 446 / 352;
      background-color: var(--brand);
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      -webkit-mask-size: contain;
      mask-size: contain;
    }

    .logo span {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: .04em;
      color: var(--text);
    }

    .tagline {
      margin: 0;
      font-size: 11px;
      font-weight: 400;
      color: var(--text-dim);
      /* 자간을 넓히면 좁은 화면에서 문구가 두 줄로 깨지면서 KOR 버튼이 아래로 밀립니다 */
      letter-spacing: .04em;
      line-height: 1.7;
      white-space: nowrap;
    }

    /* 로고 아래 얇은 골드 구분선 */
    .rule {
      width: 44px;
      height: 1px;
      margin: 0 auto;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: .6;
    }

    /* ── 섹션 제목: 양옆에 얇은 선을 두른 소형 라벨 ── */
    .section-title {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 44px 0 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: .14em;
      white-space: nowrap;
    }

    .section-title::before,
    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--gold-line);
    }

    .section-title:first-of-type {
      margin-top: 0;
    }

    /* ── 링크 블록 ── */
    .block {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
      padding: 10px 12px;
      min-height: 72px;
      /* 살짝 비치게 두면 뒤의 그라데이션이 카드에도 은은하게 배어 전체가 따뜻해집니다 */
      background: rgba(255, 255, 255, .86);
      border: 1px solid var(--card-line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      text-decoration: none;
      color: inherit;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .block:hover {
      transform: translateY(-2px);
      border-color: var(--gold-line);
      box-shadow: var(--shadow-hover);
    }

    .block:active {
      transform: scale(.99);
    }

    .block:focus-visible {
      outline: 1px solid var(--gold);
      outline-offset: 3px;
    }

    /* url 이 아직 비어 있는 블록: 눌리지 않고 흐리게 표시됨 */
    .block--pending {
      opacity: .48;
      cursor: default;
    }

    .block--pending:hover {
      transform: none;
      border-color: var(--card-line);
      box-shadow: var(--shadow);
    }

    /* 원형 썸네일. 사진이 들어가면 사진이, 없으면 라인 아이콘이 표시됨 */
    .thumb {
      flex: 0 0 50px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid var(--gold-line);
      background: #f4f1ec;
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .label {
      flex: 1;
      font-size: 17px;
      font-weight: 500;
      text-align: center;
      letter-spacing: -.01em;
      word-break: keep-all;
      line-height: 1.35;
    }

    .share {
      flex: 0 0 30px;
      width: 30px;
      height: 30px;
      border: 0;
      padding: 0;
      background: transparent;
      border-radius: 50%;
      color: #b6b2a8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .18s ease, color .18s ease;
    }

    .share:hover {
      background: rgba(168, 135, 74, .1);
      color: var(--gold);
    }

    .share:focus-visible {
      outline: 1px solid var(--gold);
      outline-offset: 2px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 32px;
      transform: translate(-50%, 16px);
      padding: 12px 22px;
      background: var(--text);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .02em;
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(31, 34, 41, .22);
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease, transform .22s ease;
      z-index: 30;
    }

    .toast.on {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>

      drop: `<path d="M12 3.2c3 4.4 6 7.4 6 10.9a6 6 0 0 1-12 0c0-3.5 3-6.5 6-10.9z" />`,
      bed: `<path d="M2.6 19.4v-5.6a2 2 0 0 1 2-2h14.8a2 2 0 0 1 2 2v5.6" /><path d="M2.6 16.8h18.8" /><path d="M6.2 11.8V9.2a1.6 1.6 0 0 1 1.6-1.6h8.4a1.6 1.6 0 0 1 1.6 1.6v2.6" /><path d="M2.6 19.4v1.4" /><path d="M21.4 19.4v1.4" />`,
      bottle: `<path d="M9.6 3.4h4.8" /><path d="M10.6 3.4v3l-2 2.7a3 3 0 0 0-.6 1.8V19a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-8.1a3 3 0 0 0-.6-1.8l-2-2.7v-3" /><path d="M8 14.2h8" />`,
      case: `<rect x="2.8" y="7.2" width="18.4" height="13.6" rx="2.4" /><path d="M8.4 7.2V5.4a2 2 0 0 1 2-2h3.2a2 2 0 0 1 2 2v1.8" /><path d="M2.8 12.4h18.4" />`,
      chat: `<path d="M20.5 15.2a2 2 0 0 1-2 2H8.2L4 20.4V5.4a2 2 0 0 1 2-2h12.5a2 2 0 0 1 2 2z" />`
    };

    // 라인 아이콘 공통 껍데기 (선 굵기·모서리 처리를 한 곳에서 관리)
    function lineIcon(name) {
      const body = ICONS[name];
      if (!body) return "";
      return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
    }

    let currentLang = "en";

    function getSite() {
      return currentLang === "ko" ? SITE_KO : SITE_EN;
    }

    function renderProfile() {
      const site = getSite();
      const logo = document.getElementById("logo");
      logo.innerHTML = site.logo
        ? `<span class="mark" role="img" aria-label="${site.name}"
             style="-webkit-mask-image:url('${site.logo}');mask-image:url('${site.logo}')"></span>`
        : `<span>${site.logoText}</span>`;
      document.getElementById("tagline").textContent = site.tagline;
    }

    function renderBlock(block) {
      const thumb = USE_PHOTOS && block.thumb
        ? `<img src="${block.thumb}" alt="" data-fallback="${block.icon || ""}" />`
        : lineIcon(block.icon);

      const inner = `
      <span class="thumb">${thumb}</span>
      <span class="label">${block.label}</span>`;

      // url 이 비어 있으면 링크가 아닌 흐린 박스로 렌더링 (빈 링크로 새 탭이 열리는 것을 방지)
      if (!block.url) {
        return `
    <div class="block block--pending" aria-disabled="true">
      ${inner}
      <span class="share" aria-hidden="true"></span>
    </div>`;
      }

      return `
    <a class="block" href="${block.url}" target="_blank" rel="noopener">
      ${inner}
      <button class="share" type="button" data-url="${block.url}" aria-label="${block.label}">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <circle cx="12" cy="5" r="1.7" /><circle cx="12" cy="12" r="1.7" /><circle cx="12" cy="19" r="1.7" />
        </svg>
      </button>
    </a>`;
    }

    function renderSections() {
      const site = getSite();
      document.getElementById("sections").innerHTML = site.sections.map(section => `
    <h2 class="section-title">${section.title}</h2>
    ${section.blocks.map(renderBlock).join("")}
  `).join("");

      // 사진 파일이 없거나 깨진 칸은 라인 아이콘으로 되돌림
      document.querySelectorAll(".thumb img[data-fallback]").forEach(img => {
        img.addEventListener("error", () => {
          img.parentElement.innerHTML = lineIcon(img.dataset.fallback);
        });
      });
    }

    let toastTimer;
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("on");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("on"), 1800);
    }

    function toggleLang() {
      currentLang = currentLang === "ko" ? "en" : "ko";
      document.getElementById("langToggle").textContent = currentLang === "ko" ? "EN" : "KOR";
      document.documentElement.lang = currentLang;
      renderProfile();
      renderSections();
    }

    document.getElementById("langToggle").addEventListener("click", toggleLang);

    // 블록 오른쪽 ⋮ 버튼 → 공유(모바일) 또는 링크 복사(데스크톱)
    document.addEventListener("click", async event => {
      const button = event.target.closest(".share");
      if (!button) return;

      event.preventDefault();
      const url = button.dataset.url;
      const site = getSite();

      if (navigator.share) {
        try { await navigator.share({ url }); return; } catch { /* 취소 시 복사로 넘어감 */ }
      }
      try {
        await navigator.clipboard.writeText(url);
        showToast(site.toastCopied);
      } catch {
        showToast(site.toastFailed);
      }
    });

    renderProfile();
    renderSections();
  </script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll("a, button").forEach(function (element) {
      const text = element.textContent.trim();

      if (text === "릴리브 클리닉" || text === "RELIEVE CLINIC") {
        element.addEventListener(
          "click",
          function (event) {
            event.preventDefault();
            event.stopImmediatePropagation();
            window.location.href = "https://www.relieveclinic.co.kr/";
          },
          true
        );
      }
    });
  });
</script>
</body>
</html>
